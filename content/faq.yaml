clinic:
  - question: "Who owns the clinic's data?"
    answer: "You do. Every record stays under your clinic's control and can be exported at any time, including original documents. We never sell data."
  - question: "Can we move from our current software or paper records?"
    answer: "Yes. We import patients and history from CSV or Excel, check for duplicates, and help your team through the switch."
  - question: "How long does setup take?"
    answer: "Most clinics are live within a week: account setup, data import, a training session for doctors and front desk, then go live."
  - question: "Do I need DocConnect to use the EMR, or the other way round?"
    answer: "No. Use the EMR on its own, DocConnect on its own with your existing EMR, or both together as one package."
  - question: "What happens if the internet goes down?"
    answer: "Your data is safe in the cloud. Walk-ins can still be noted at the desk and entered once you're back online; nothing already saved is lost."
  - question: "Is patient data secure?"
    answer: "Yes. Role-based access, clinic data separation, encrypted connections, audit trails and regular backups are built in."
  - question: "Do you train our staff and offer support?"
    answer: "Yes. Training is included at setup, and support is available on WhatsApp, phone and email."
  - question: "Which countries do you support?"
    answer: "India and the UAE today, with more regions coming. The product supports local currency, tax and phone formats."
patient:
  - question: "Is DocConnect free for patients?"
    answer: "Yes. Searching and booking are free. You pay the doctor's consultation fee as usual."
  - question: "How does the live queue work?"
    answer: "After booking, you get a token. The app shows how many people are ahead of you and when to leave home, and updates if the doctor is running late."
  - question: "Can I book for my family?"
    answer: "Yes. Add family members to your account and book for any of them."
  - question: "Where do I see my prescription?"
    answer: "Once the doctor finalises it, the prescription appears in your app to view, download or share."
